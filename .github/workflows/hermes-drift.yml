name: Hermes drift check

# Early-warning net for Hermes-API drift: CI pins hermes-agent to a specific
# commit (see ci.yml), so it cannot see the upstream churn. This workflow
# checks out hermes-agent@main and runs the exact same gates — the four
# existing ones plus the lightweight architecture gates (complexity / layering / extraction) — against it. A failure
# here means a Hermes change broke the plugin before a user pulled it.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    name: Gates vs latest Hermes main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Hermes Agent (latest main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: _deps/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            _deps/hermes-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e _deps/hermes-agent
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: python -m pyrefly check --python-interpreter-path "$(which python)" --search-path _deps/hermes-agent --min-severity warn --output-format=github

      - name: Unit tests
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/_deps/hermes-agent
        # `unittest discover` (not an explicit file list) so a new test_*.py —
        # including the arch-gate tests — is picked up automatically and
        # can never silently drop out of CI. Discovery does not recurse into
        # _deps/ (no __init__.py), so vendored tests stay out.
        run: |
          coverage run -m unittest discover -s . -p "test_*.py"
          coverage report -m

      - name: Enforce coverage floor
        run: coverage report --fail-under=80

      - name: Architecture gates (complexity / layering / extraction)
        run: python scripts/check_arch_gates.py

      - name: Open drift-failure issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # The drift net is schedule-only; a failure must be surfaced, not
          # left to the Actions tab. One open "Hermes drift check failed"
          # issue at a time: if one already exists we append a comment with
          # the new failure date and run link so repeated weekly failures
          # accumulate visible signal instead of being silently swallowed by
          # the dedup (a human triages/closes the issue when resolved).
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find((issue) => issue.title.startsWith('Hermes drift check failed'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Drift check failed again on ${date}. See the [latest run](${runUrl}).`,
              });
              console.log(`Commented on existing issue #${existing.number}.`);
              return;
            }
            const title = `Hermes drift check failed on ${date}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `The scheduled [hermes drift check](${runUrl}) failed.`,
                '',
                'A Hermes Agent `main` change likely broke the plugin before a user pulled it. Check the workflow log for the failing gate.',
              ].join('\n'),
            });
